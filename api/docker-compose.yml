# Local API — same container shape as Cloud Run (port 8080 inside, 5217 on the Mac).
# Database is Neon via DATABASE_URL in api/.env — not a local Postgres container.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5217:8080"
    env_file:
      - path: .env
        required: true
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    restart: unless-stopped
