name: API (test)

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "api-worker/**"
      - "global.json"
      - ".github/workflows/api-dev.yml"
  pull_request:
    paths:
      - "api/**"
      - "api-worker/**"
      - "global.json"
      - ".github/workflows/api-dev.yml"

concurrency:
  group: api-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test .NET API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test GetGrounded.slnx --configuration Release --nologo

  worker-check:
    name: Typecheck API worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api-worker/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
