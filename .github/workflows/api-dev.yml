name: API (dev)

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "global.json"
      - ".github/workflows/api-dev.yml"
  pull_request:
    paths:
      - "api/**"
      - "global.json"
      - ".github/workflows/api-dev.yml"

concurrency:
  group: api-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test GetGrounded.slnx --configuration Release --nologo

  deploy:
    name: Deploy Cloud Run (dev)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test]
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/317766274600/locations/global/workloadIdentityPools/github-pool/providers/github
          service_account: github-deploy@get-ground-448ca.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy image only
        run: |
          # Terraform owns service shape (SQL, secrets, env, public IAM).
          # Cost pins stay here so a source deploy cannot raise max instances.
          gcloud run deploy getgrounded-dev-api \
            --source=api \
            --project=get-ground-448ca \
            --region=us-central1 \
            --min-instances=0 \
            --max-instances=2 \
            --memory=512Mi \
            --cpu=1 \
            --quiet
