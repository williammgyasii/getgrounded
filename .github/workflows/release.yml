name: Release (CD)

# Production deploy: push an annotated semver tag on main, e.g. v1.0.0
#   git tag v1.0.0 && git push origin v1.0.0

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-prod
  cancel-in-progress: false

jobs:
  api:
    name: Deploy API
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api-worker/package-lock.json
      - run: npm ci
        working-directory: api-worker
      - name: Deploy Worker and container
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: api-worker
          command: deploy
        env:
          DOCKER_BUILDKIT: "1"

  website:
    name: Deploy website
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_LOOPS_FORM_ID: ${{ secrets.VITE_LOOPS_FORM_ID }}
          VITE_SUPPORT_EMAIL: ${{ secrets.VITE_SUPPORT_EMAIL }}
          VITE_HERO_VIDEO_URL: ${{ secrets.VITE_HERO_VIDEO_URL }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          command: pages deploy dist --project-name=get-grounded-web --branch=main

  mobile:
    name: EAS production build
    runs-on: ubuntu-latest
    environment: prod
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build
        run: eas build --profile production --platform all --non-interactive --no-wait
