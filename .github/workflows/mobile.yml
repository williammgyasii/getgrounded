name: Mobile

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI — typecheck
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  release-scope:
    name: CD — scope since last tag
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.scope.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: prev
        run: |
          PREV=$(git tag -l 'v*' --sort=-v:refname | sed -n '2p')
          if [ -z "$PREV" ]; then
            echo "first=true" >> "$GITHUB_OUTPUT"
          else
            echo "base=$PREV" >> "$GITHUB_OUTPUT"
          fi
      - uses: dorny/paths-filter@v3
        id: filter
        if: steps.prev.outputs.first != 'true'
        with:
          base: ${{ steps.prev.outputs.base }}
          filters: |
            mobile:
              - 'mobile/**'
              - '.github/workflows/mobile.yml'
      - id: scope
        run: |
          if [ "${{ steps.prev.outputs.first }}" = "true" ] || [ "${{ steps.filter.outputs.mobile }}" = "true" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: CD — EAS production (${{ matrix.platform }})
    needs: [release-scope]
    if: |
      always() && (
        github.event_name == 'workflow_dispatch'
        || (github.ref_type == 'tag' && needs.release-scope.outputs.deploy == 'true')
      )
    strategy:
      fail-fast: false
      matrix:
        platform: [android, ios]
    runs-on: ubuntu-latest
    environment: prod
    defaults:
      run:
        working-directory: mobile
    env:
      # Push is enabled manually on the App ID; EAS PATCH for PUSH_NOTIFICATIONS often fails on Apple's API.
      EXPO_NO_CAPABILITY_SYNC: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Require EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::EXPO_TOKEN is missing in GitHub environment prod."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Queue EAS production build
        run: eas build --profile production --platform ${{ matrix.platform }} --non-interactive --no-wait
