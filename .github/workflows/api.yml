name: API

on:
  pull_request:
    paths:
      - "api/**"
      - "api-worker/**"
      - "global.json"
      - ".github/workflows/api.yml"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "api/**"
      - "api-worker/**"
      - "global.json"
      - ".github/workflows/api.yml"
  workflow_dispatch:

concurrency:
  group: api-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI — test
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test GetGrounded.slnx --configuration Release --nologo
        working-directory: api

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api-worker/package-lock.json
      - run: npm ci
        working-directory: api-worker
      - run: npm test
        working-directory: api-worker
      - run: npm run check
        working-directory: api-worker

  release-scope:
    name: CD — scope since last tag
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.scope.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: prev
        run: |
          PREV=$(git tag -l 'v*' --sort=-v:refname | sed -n '2p')
          if [ -z "$PREV" ]; then
            echo "first=true" >> "$GITHUB_OUTPUT"
          else
            echo "base=$PREV" >> "$GITHUB_OUTPUT"
          fi
      - uses: dorny/paths-filter@v3
        id: filter
        if: steps.prev.outputs.first != 'true'
        with:
          base: ${{ steps.prev.outputs.base }}
          filters: |
            api:
              - 'api/**'
              - 'api-worker/**'
              - 'global.json'
              - '.github/workflows/api.yml'
      - id: scope
        run: |
          if [ "${{ steps.prev.outputs.first }}" = "true" ] || [ "${{ steps.filter.outputs.api }}" = "true" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: CD — Cloudflare Containers
    needs: [release-scope]
    if: |
      always() && (
        github.event_name == 'workflow_dispatch'
        || (github.ref_type == 'tag' && needs.release-scope.outputs.deploy == 'true')
      )
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api-worker/package-lock.json
      - run: npm ci
        working-directory: api-worker
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: api-worker
          command: deploy
        env:
          DOCKER_BUILDKIT: "1"
